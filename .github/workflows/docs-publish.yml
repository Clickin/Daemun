name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Starlight docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main' && env.ACT != 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main' && env.ACT != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-docs

  deploy:
    name: Deploy Astro Starlight docs
    needs: build
    if: github.repository == 'Clickin/Daemun' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
